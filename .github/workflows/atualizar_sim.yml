name: Atualizar SIM (MRJ)

on:
  schedule:
    # Dia 5 de cada mês, 08:00 UTC (05:00 em Brasília)
    - cron: "0 8 5 * *"
  workflow_dispatch:
    inputs:
      anos:
        description: >
          Anos a processar, separados por espaço (ex.: "2016 2017").
          Vazio = ano anterior + ano corrente. Para a carga inicial use
          "2006 2007 2008 2009 2010 2011 2012 2013 2014 2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025 2026".
        required: false
        default: ""

permissions:
  contents: write # commit dos dados no repositório e atualização da Release

concurrency:
  group: atualizar-sim
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: sim-mrj
      ASSET: silver_sim_mrj.tar.gz
    steps:
      # Os dados já estão no repositório (pasta datalake/); o pipeline só reescreve os anos pedidos.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Definir anos
        id: anos
        env:
          ENTRADA: ${{ github.event.inputs.anos }}
        run: |
          if [ -z "$ENTRADA" ]; then
            ANO=$(date +%Y)
            ENTRADA="$((ANO-1)) $ANO"
          fi
          if ! [[ "$ENTRADA" =~ ^[0-9]{4}( [0-9]{4})*$ ]]; then
            echo "Entrada inválida para anos: $ENTRADA" >&2
            exit 1
          fi
          echo "anos=$ENTRADA" >> "$GITHUB_OUTPUT"
          echo "Anos desta execução: $ENTRADA"

      - name: Rodar pipeline (modo direto, só MRJ)
        env:
          ANOS: ${{ steps.anos.outputs.anos }}
        run: python sim_datalake.py direto --anos $ANOS --apagar-zip

      - name: Agregar óbitos diários por ocorrência (para o painel)
        run: python agregar_obitos.py --raiz datalake --saida datalake/obitos_diarios_ocorrencia_mrj.csv

      - name: Commitar os dados no repositório
        env:
          ANOS: ${{ steps.anos.outputs.anos }}
        run: |
          .github/scripts/commitar_dados.sh "dados: SIM do MRJ, anos ${ANOS}"

      # Enquanto o painel ainda lê as Releases, elas continuam sendo atualizadas.
      # O banco combinado foi descontinuado e fica fora do pacote.
      - name: Empacotar silver
        run: tar -czf "$ASSET" -C datalake --exclude='silver/sim/combinado_mrj' --exclude='qa/resumo_combinado.csv' silver qa

      - name: Publicar na Release
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "SIM - Mortalidade MRJ (silver)" \
              --notes "Recortes do município do Rio de Janeiro (ocorrência e residência), em Parquet particionado por ano. Cópia dos dados que estão em datalake/ no repositório. Atualizado automaticamente."
          fi
          gh release upload "$RELEASE_TAG" "$ASSET" datalake/obitos_diarios_ocorrencia_mrj.csv --clobber
